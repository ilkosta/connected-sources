spring:
  datasource:
    url: jdbc:h2:mem:onboarding_it;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    # Usiamo una cartella di migrazioni separata per H2, così non confligge con le DDL Postgres
    locations: classpath:db/migration-h2
    baseline-on-migrate: true
    clean-disabled: false
    #clean-on-validation-error: true
    validate-migration-naming: false

  # Disabilita liquibase se presente
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

# per verificare esecuzione migrazioni
logging:
  level:
    org.flywaydb.core.internal.command.DbMigrate: INFO

tenant:
  base-directory: /home/costa/pkg/connected-sources/backend/data/tenants

backend:
  base-url: http://localhost:8080/